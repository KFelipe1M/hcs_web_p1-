{% extends "encyclopedia/layout.html" %}
{% block title %}
Edit | {{ title }} | Encyclopedia
{% endblock %}

{% block body %}
    <form method="post">
        {% csrf_token %}

        <label>Entry title</form><br><br>
            <input type="text" name="title" value={{ title }} required><br><br>
            <label> Entry description </label><br>
            <textarea name="content" style="width: 500px; height: 200px;" required> {{ content }} </textarea><br><br>

            <input type="submit" value="Save">

    </form>
{% endblock %}
