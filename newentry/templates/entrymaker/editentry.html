{% extends "encyclopedia/layout.html" %}
{% block title %}
Edit | {{ title }} | Encyclopedia
{% endblock %}

{% block body %}
    <h1>{{ title }}</h1>
    <form method="post">
        {%  csrf_token  %}
        <label>Entry Description</label><br>
        <textarea name="content" style="width: 500px; height: 200px;" required>{{ content }}</textarea>
        <input type="submit" value="save">
    </form>
{% endblock %}
